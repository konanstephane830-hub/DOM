<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panier Interactif</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
}

h1{
    text-align:center;
}

.card-body{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.controls button{
    background:#007BFF;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.quantity{
    margin:0 10px;
    font-size:20px;
}

.like-btn{
    border:none;
    background:none;
    font-size:24px;
    cursor:pointer;
    color:gray;
}

.like-btn.liked{
    color:red;
}

.delete-btn{
    border:none;
    background:#dc3545;
    color:white;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.total-box{
    background:white;
    padding:15px;
    border-radius:10px;
    text-align:right;
    font-size:22px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>🛒 Mon Panier</h1>

<div class="card-body">
    <div>
        <h3>Chaussures</h3>
        <p><span class="unit-price">15000</span> F CFA</p>
    </div>

    <div class="controls">
        <button class="minus-btn">-</button>
        <span class="quantity">1</span>
        <button class="plus-btn">+</button>
    </div>

    <button class="like-btn">❤</button>
    <button class="delete-btn">🗑️</button>
</div>

<div class="card-body">
    <div>
        <h3>T-shirt</h3>
        <p><span class="unit-price">8000</span> F CFA</p>
    </div>

    <div class="controls">
        <button class="minus-btn">-</button>
        <span class="quantity">1</span>
        <button class="plus-btn">+</button>
    </div>

    <button class="like-btn">❤</button>
    <button class="delete-btn">🗑️</button>
</div>

<div class="card-body">
    <div>
        <h3>Montre</h3>
        <p><span class="unit-price">25000</span> F CFA</p>
    </div>

    <div class="controls">
        <button class="minus-btn">-</button>
        <span class="quantity">1</span>
        <button class="plus-btn">+</button>
    </div>

    <button class="like-btn">❤</button>
    <button class="delete-btn">🗑️</button>
</div>

<div class="total-box">
    Total : <span class="total">0</span> F CFA
</div>

</div>

<script>

function updateTotal(){

    let total=0;

    document.querySelectorAll(".card-body").forEach(card=>{

        const price=Number(card.querySelector(".unit-price").textContent);
        const quantity=Number(card.querySelector(".quantity").textContent);

        total+=price*quantity;

    });

    document.querySelector(".total").textContent=total;

}

document.querySelectorAll(".plus-btn").forEach(btn=>{

    btn.addEventListener("click",()=>{

        const quantity=btn.parentElement.querySelector(".quantity");

        quantity.textContent=Number(quantity.textContent)+1;

        updateTotal();

    });

});

document.querySelectorAll(".minus-btn").forEach(btn=>{

    btn.addEventListener("click",()=>{

        const quantity=btn.parentElement.querySelector(".quantity");

        if(Number(quantity.textContent)>1){

            quantity.textContent=Number(quantity.textContent)-1;

            updateTotal();

        }

    });

});

document.querySelectorAll(".delete-btn").forEach(btn=>{

    btn.addEventListener("click",()=>{

        btn.closest(".card-body").remove();

        updateTotal();

    });

});

document.querySelectorAll(".like-btn").forEach(btn=>{

    btn.addEventListener("click",()=>{

        btn.classList.toggle("liked");

    });

});

updateTotal();

</script>

</body>
</html>
